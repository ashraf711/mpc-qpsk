[project]
name = "qpskbsc"
version = "0.2.0"
description = "Belief-space predictive control of an actuator-constrained adaptive displacement receiver for QPSK coherent-state discrimination"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.scripts]
qpskbsc = "qpskbsc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qpskbsc"]
